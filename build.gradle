plugins {
	id 'fabric-loom' version "${loom_version}"
	id 'maven-publish'
	id 'jacoco'
	id 'net.ltgt.errorprone' version '4.1.0'
}

version = project.mod_version
group = project.maven_group

base {
	archivesName = project.archives_base_name
}

// ---- Reproducible builds (P1-8) ----
// Lock resolved versions so the same commit always uses the same dependency graph.
// Update locks after intentional dependency changes:
//   ./gradlew dependencies --write-locks
dependencyLocking {
	lockAllConfigurations()
	// LWJGL resolves this bridge only on macOS. Its artifact remains checksum-verified.
	ignoredDependencies.add('ca.weblite:java-objc-bridge')
}

// Stable zip/jar metadata across machines and rebuild times.
tasks.withType(AbstractArchiveTask).configureEach {
	preserveFileTimestamps = false
	reproducibleFileOrder = true
	dirPermissions { unix('755') }
	filePermissions { unix('644') }
}

repositories {
	mavenCentral()
	maven {
		name = 'AliyunCentral'
		url = 'https://maven.aliyun.com/repository/central'
	}
	maven {
		name = 'Google'
		url = 'https://maven.google.com'
	}
}


configurations {
	spotbugs
}

loom {
	// 仅使用 main 源集，客户端代码放在 src/main/java/com/beatblock/client/
	mods {
		"beatblock" {
			sourceSet sourceSets.main
		}
	}
}

dependencies {
	// To change the versions see the gradle.properties file
	minecraft "com.mojang:minecraft:${project.minecraft_version}"
	mappings "net.fabricmc:yarn:${project.yarn_mappings}:v2"
	modImplementation "net.fabricmc:fabric-loader:${project.loader_version}"

	// Fabric API
	modImplementation "net.fabricmc.fabric-api:fabric-api:${project.fabric_api_version}"

	// ImGui Java bindings (UI - Dockspace 布局)，jar-in-jar 打入发布包
	def imguiVersion = "1.86.11"
	implementation include("io.github.spair:imgui-java-binding:${imguiVersion}")
	implementation include("io.github.spair:imgui-java-lwjgl3:${imguiVersion}")
	// 三平台 natives 均打入发布包；binding 运行时按 OS 加载对应 JNI，无冲突
	runtimeOnly include("io.github.spair:imgui-java-natives-windows:${imguiVersion}")
	runtimeOnly include("io.github.spair:imgui-java-natives-linux:${imguiVersion}")
	runtimeOnly include("io.github.spair:imgui-java-natives-macos:${imguiVersion}")

	// JSON 解析（BeatmapReader 使用）
	implementation include("com.google.code.gson:gson:2.10.1")

	// 空值注解（公共 API 契约）
	implementation include("org.jspecify:jspecify:1.0.0")

	// MP3 解码（Java Sound SPI），用于时间线真实音频播放
	implementation include("com.googlecode.soundlibs:mp3spi:1.9.5-1")
	implementation include("com.googlecode.soundlibs:tritonus-share:0.3.7-2")
	implementation include("com.googlecode.soundlibs:jlayer:1.0.1.4")

	testImplementation "org.junit.jupiter:junit-jupiter:5.11.4"
	testImplementation "net.fabricmc:fabric-loader-junit:${project.loader_version}"
	testRuntimeOnly "org.junit.platform:junit-platform-launcher"

	spotbugs 'com.github.spotbugs:spotbugs:4.10.2'

	errorprone 'com.google.errorprone:error_prone_core:2.36.0'
	errorprone 'com.uber.nullaway:nullaway:0.12.3'
}

processResources {
	inputs.property "version", project.version

	filesMatching("fabric.mod.json") {
		expand "version": inputs.properties.version
	}
}

tasks.withType(JavaCompile).configureEach {
	it.options.release = 21
	it.options.errorprone.enabled = findProperty('enableNullaway') == 'true'
	if (it.name == 'compileJava' && findProperty('enableNullaway') == 'true') {
		it.options.compilerArgs << '-XDaddTypeAnnotationsToSymbol=true'
		it.options.errorprone {
			disableAllChecks = true
			error('NullAway')
			option('NullAway:OnlyNullMarked', 'true')
			option('NullAway:JSpecifyMode', 'true')
		}
	}
}

tasks.withType(Test).configureEach {
	useJUnitPlatform()
	systemProperty 'junit.jupiter.extensions.autodetection.enabled', 'true'
}

tasks.register('verifyBundledDependencies') {
	dependsOn remapJar
	doLast {
		def jarFile = remapJar.archiveFile.get().asFile
		def nested = []
		new java.util.zip.ZipFile(jarFile).withCloseable { zip ->
			zip.entries().each { entry ->
				if (entry.name.startsWith('META-INF/jars/')) {
					nested << entry.name
				}
			}
		}
		[
			'imgui-java-binding',
			'imgui-java-lwjgl3',
			'imgui-java-natives-windows',
			'imgui-java-natives-linux',
			'imgui-java-natives-macos',
			'gson',
			'mp3spi',
			'tritonus-share',
			'jlayer',
		].each { dep ->
			if (!nested.any { it.contains(dep) }) {
				throw new GradleException("Missing bundled dependency in ${jarFile.name}: ${dep}")
			}
		}
	}
}

check.dependsOn verifyBundledDependencies

/**
 * Release fingerprint: after remapJar, write SHA-256 of the published mod jar.
 * Pair a git tag (e.g. v1.0.0) with build/libs/*.jar + this checksum for unique release artifacts.
 *
 *   ./gradlew fingerprintReleaseJar
 *   # or: ./gradlew remapJar fingerprintReleaseJar
 */
tasks.register('fingerprintReleaseJar') {
	group = 'verification'
	description = 'Write SHA-256 of the remapped release jar (tag ↔ unique artifact)'
	dependsOn remapJar
	def jarProvider = remapJar.archiveFile
	def outProvider = layout.buildDirectory.file('libs/beatblock-release.sha256')
	inputs.file jarProvider
	outputs.file outProvider
	doLast {
		def jarFile = jarProvider.get().asFile
		def digest = java.security.MessageDigest.getInstance('SHA-256')
		jarFile.withInputStream { is ->
			byte[] buf = new byte[8192]
			int n
			while ((n = is.read(buf)) > 0) {
				digest.update(buf, 0, n)
			}
		}
		def hex = digest.digest().collect { String.format('%02x', it) }.join('')
		def out = outProvider.get().asFile
		out.parentFile.mkdirs()
		out.text = "${hex}  ${jarFile.name}\n"
		logger.lifecycle("Release jar fingerprint: ${hex}  (${jarFile.name})")
		logger.lifecycle("Written to ${out}")
	}
}

// Optional CI gate: fail if an expected fingerprint file is provided and mismatches.
//   ./gradlew verifyReleaseFingerprint -PreleaseSha256=<hex>
tasks.register('verifyReleaseFingerprint') {
	group = 'verification'
	description = 'Verify remapped jar SHA-256 against -PreleaseSha256=<hex>'
	dependsOn fingerprintReleaseJar
	onlyIf { project.hasProperty('releaseSha256') }
	doLast {
		def expected = project.property('releaseSha256').toString().trim().toLowerCase()
		def actualLine = layout.buildDirectory.file('libs/beatblock-release.sha256').get().asFile.text.trim()
		def actual = actualLine.tokenize(/\s+/)[0].toLowerCase()
		if (expected != actual) {
			throw new GradleException("Release jar SHA-256 mismatch.\n  expected: ${expected}\n  actual:   ${actual}")
		}
		logger.lifecycle("Release jar SHA-256 matches: ${actual}")
	}
}

jacoco {
	toolVersion = '0.8.12'
}

tasks.named('jacocoTestReport', JacocoReport) {
	dependsOn test

	reports {
		xml.required = true
		html.required = true
	}

	classDirectories.setFrom files(sourceSets.main.output.classesDirs).asFileTree.matching {
		include 'com/beatblock/**'
	}
	sourceDirectories.setFrom sourceSets.main.java.srcDirs
	executionData.setFrom fileTree(layout.buildDirectory.dir('jacoco')).include('**/*.exec')
}

tasks.named('test') {
	finalizedBy jacocoTestReport
}

def spotbugsReportDir = layout.buildDirectory.dir('reports/spotbugs/main')

tasks.register('spotbugsMain', JavaExec) {
	group = 'verification'
	description = 'Run SpotBugs static analysis on main classes'
	dependsOn classes

	classpath = configurations.spotbugs
	mainClass = 'edu.umd.cs.findbugs.FindBugs2'

	def htmlReport = spotbugsReportDir.get().file('index.html').asFile
	def xmlReport = spotbugsReportDir.get().file('spotbugs.xml').asFile
	def excludeFile = file('config/spotbugs/exclude.xml')

	doFirst {
		htmlReport.parentFile.mkdirs()
		def classDir = layout.buildDirectory.dir('classes/java/main').get().asFile
		if (!classDir.directory || !classDir.exists()) {
			throw new GradleException("No compiled classes found for SpotBugs analysis at ${classDir}")
		}

		setArgs([
			'-effort:max',
			'-medium',
			'-xml',
			'-output', xmlReport.absolutePath,
			'-exclude', excludeFile.absolutePath,
			'-onlyAnalyze', 'com.beatblock.-',
			'-auxclasspath', sourceSets.main.compileClasspath.asPath,
			classDir.absolutePath,
		])
	}
}


tasks.register('spotbugsUpdateBaseline') {
	group = 'verification'
	description = 'Regenerate SpotBugs fingerprint baseline from the current report'
	dependsOn spotbugsMain

	def reportFile = file(layout.buildDirectory.file('reports/spotbugs/main/spotbugs.xml'))
	def countFile = file('config/spotbugs/baseline.txt')
	def fingerprintsFile = file('config/spotbugs/baseline_fingerprints.txt')

	inputs.file reportFile
	outputs.files countFile, fingerprintsFile

	doLast {
		if (!reportFile.exists()) {
			throw new GradleException("SpotBugs XML report not found: ${reportFile}")
		}
		def root = new groovy.xml.XmlParser().parse(reportFile)
		def fingerprints = root.BugInstance.collect { bug ->
			def type = bug.@type
			def clazz = bug.Class[0]?.'@classname' ?: ''
			def method = bug.Method.find { it.'@role' != 'METHOD_CALLED' }?.'@name' ?: bug.Method[0]?.'@name' ?: ''
			def line = bug.SourceLine.find { it.'@role' == 'SOURCE_LINE_DEREF' }?.'@start' ?: bug.SourceLine[0]?.'@start' ?: '0'
			String.valueOf(type) + '|' + String.valueOf(clazz) + '|' + String.valueOf(method) + '|' + String.valueOf(line)
		}.toSorted()
		countFile.text = "${fingerprints.size()}\n"
		fingerprintsFile.text = fingerprints.join('\n') + '\n'
		logger.lifecycle("SpotBugs baseline regenerated: ${fingerprints.size()} fingerprints")
	}
}

tasks.register('spotbugsCheck') {
	group = 'verification'
	description = 'Ensure SpotBugs does not introduce new findings and total count does not exceed baseline'
	dependsOn spotbugsMain

	def reportFile = file(layout.buildDirectory.file('reports/spotbugs/main/spotbugs.xml'))
	def countFile = file('config/spotbugs/baseline.txt')
	def fingerprintsFile = file('config/spotbugs/baseline_fingerprints.txt')
	def resultFile = layout.buildDirectory.file('reports/spotbugs/spotbugs-check-result.txt')

	inputs.files reportFile, countFile, fingerprintsFile
	outputs.file resultFile

	doLast {
		if (!reportFile.exists()) {
			throw new GradleException("SpotBugs XML report not found: ${reportFile}")
		}
		if (!countFile.exists()) {
			throw new GradleException("SpotBugs count baseline file not found: ${countFile}. Run ./gradlew spotbugsUpdateBaseline.")
		}
		if (!fingerprintsFile.exists()) {
			throw new GradleException("SpotBugs fingerprint baseline file not found: ${fingerprintsFile}. Run ./gradlew spotbugsUpdateBaseline.")
		}
		def baselineCount = countFile.text.trim().toInteger()
		def baselineFingerprints = fingerprintsFile.readLines().toSet()

		def root = new groovy.xml.XmlParser().parse(reportFile)
		def current = root.BugInstance.collect { bug ->
			def type = bug.@type
			def clazz = bug.Class[0]?.'@classname' ?: ''
			def method = bug.Method.find { it.'@role' != 'METHOD_CALLED' }?.'@name' ?: bug.Method[0]?.'@name' ?: ''
			def line = bug.SourceLine.find { it.'@role' == 'SOURCE_LINE_DEREF' }?.'@start' ?: bug.SourceLine[0]?.'@start' ?: '0'
			String.valueOf(type) + '|' + String.valueOf(clazz) + '|' + String.valueOf(method) + '|' + String.valueOf(line)
		}
		def bugCount = current.size()
		def newFindings = current.findAll { !baselineFingerprints.contains(it) }

		def resultFileObj = resultFile.get().asFile
		resultFileObj.parentFile.mkdirs()
		resultFileObj.text = "SpotBugs bugs: ${bugCount} (baseline count: ${baselineCount}, new findings: ${newFindings.size()})\n"
		if (!newFindings.isEmpty()) {
			throw new GradleException("SpotBugs introduced ${newFindings.size()} new finding(s):\n" + newFindings.join('\n') + "\nFix the new findings or run ./gradlew spotbugsUpdateBaseline after reviewing.")
		}
		if (bugCount > baselineCount) {
			throw new GradleException("SpotBugs bug count ${bugCount} exceeds baseline count ${baselineCount}. Fix or run ./gradlew spotbugsUpdateBaseline.")
		}
		logger.lifecycle("SpotBugs: ${bugCount} bugs, ${newFindings.size()} new, within baseline count ${baselineCount}.")
	}
}

check.dependsOn spotbugsCheck

tasks.register('compileNullaway') {
	group = 'verification'
	description = 'Compile main sources with NullAway (OnlyNullMarked + JSpecifyMode)'
	dependsOn compileJava
	onlyIf { findProperty('enableNullaway') == 'true' }
}

java {
	// Loom will automatically attach sourcesJar to a RemapSourcesJar task and to the "build" task
	// if it is present.
	// If you remove this line, sources will not be generated.
	withSourcesJar()

	sourceCompatibility = JavaVersion.VERSION_21
	targetCompatibility = JavaVersion.VERSION_21
}

jar {
	inputs.property "archivesName", project.base.archivesName

	from("LICENSE") {
		rename { "${it}_${inputs.properties.archivesName}"}
	}
}

// configure the maven publication
publishing {
	publications {
		create("mavenJava", MavenPublication) {
			artifactId = project.archives_base_name
			from components.java
		}
	}

	// See https://docs.gradle.org/current/userguide/publishing_maven.html for information on how to set up publishing.
	repositories {
		// Add repositories to publish to here.
		// Notice: This block does NOT have the same function as the block in the top level.
		// The repositories here will be used for publishing your artifact, not for
		// retrieving dependencies.
	}
}