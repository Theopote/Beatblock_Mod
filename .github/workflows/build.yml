# Automatically build the project and run any configured tests for every push
# and submitted pull request. This can help catch issues that only occur on
# certain platforms or Java versions, and provides a first line of defence
# against bad commits.

name: build
on: [pull_request, push]

jobs:
  build:
    name: build (Java ${{ matrix.java }})
    runs-on: ubuntu-24.04
    continue-on-error: ${{ matrix.experimental }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - java: '21'
            experimental: false
          - java: '25'
            experimental: true
    steps:
      - name: checkout repository
        uses: actions/checkout@v4
      - name: validate gradle wrapper
        uses: gradle/actions/wrapper-validation@v4
      - name: setup jdk ${{ matrix.java }}
        uses: actions/setup-java@v4
        with:
          java-version: ${{ matrix.java }}
          distribution: 'temurin'
      - name: make gradle wrapper executable
        run: chmod +x ./gradlew
      - name: build
        run: ./gradlew build
        # build → check → test + jacocoTestReport + spotbugsMain + spotbugsCheck + verifyBundledDependencies
      - name: capture build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: Artifacts-java-${{ matrix.java }}
          path: build/libs/
      - name: upload quality reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: quality-reports-java-${{ matrix.java }}
          path: |
            build/reports/jacoco/
            build/reports/spotbugs/
            build/reports/spotbugs/spotbugs-check-result.txt

  nullaway:
    name: nullaway (Java 21)
    runs-on: ubuntu-24.04
    steps:
      - name: checkout repository
        uses: actions/checkout@v4
      - name: setup jdk 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
      - name: make gradle wrapper executable
        run: chmod +x ./gradlew
      - name: compile with NullAway
        run: ./gradlew compileJava -PenableNullaway=true

  native-smoke:
    name: native smoke (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - name: checkout repository
        uses: actions/checkout@v4
      - name: setup jdk 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
      - name: make gradle wrapper executable
        if: runner.os != 'Windows'
        run: chmod +x ./gradlew
      - name: verify ImGui native binding loads
        run: ./gradlew test --tests "com.beatblock.imgui.ImGuiNativesTest"
      - name: run pure Java tests
        run: ./gradlew test
      - name: verify bundled natives
        run: ./gradlew verifyBundledDependencies
