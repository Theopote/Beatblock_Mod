# SpotBugs release milestones (fingerprint counts after exclude.xml).
# See config/spotbugs/README.md for policy.

# Active milestone gate used by spotbugsCheck / spotbugsUpdateBaseline.
current=creator-alpha

# Set true to fail spotbugsCheck when count exceeds current milestone max.
# Enabled: baseline is at or below creator-alpha.max (120 <= 180).
enforcePhaseCap=true

creator-alpha.max=180
beta.max=80
release-1.0.max=20
