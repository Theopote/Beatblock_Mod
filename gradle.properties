# Done to increase the memory available to gradle.
org.gradle.jvmargs=-Xmx1G
org.gradle.parallel=true

# IntelliJ IDEA is not yet fully compatible with configuration cache, see: https://github.com/FabricMC/fabric-loom/issues/1349
org.gradle.configuration-cache=false

# Fabric Properties
# check these on https://fabricmc.net/develop
# 可复现构建：所有版本号必须固定，禁止使用 *-SNAPSHOT（同一 commit 不同时间应得到相同构建图）。
minecraft_version=1.21.11
yarn_mappings=1.21.11+build.4
loader_version=0.18.4
# Loom 正式版（1.15 线最新补丁）；勿改回 1.15-SNAPSHOT
loom_version=1.15.5

# Mod Properties
mod_version=1.0.0
maven_group=com.beatblock
archives_base_name=beatblock

# Dependencies
fabric_api_version=0.141.3+1.21.11
# dearimgui_version=0.1.0+1.21-fabric

# Dependency verification mode (off | lenient | strict).
# After first generation of gradle/verification-metadata.xml, keep this as strict.
# Upgrade deps: ./gradlew --write-verification-metadata sha256 help classes test --write-locks
systemProp.org.gradle.dependency.verification=strict